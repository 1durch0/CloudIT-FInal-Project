apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: fullstack-cloudit
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: frontend
          image: ghcr.io/1durch0/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: fullstack-cloudit
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 8080
